name: Kontrollera KvittoKompis hemsida

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "landing.css"
      - "navigation.js"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/site-check.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Säkerhet, filer och internlänkar
        run: python3 scripts/check_site.py

  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Installera Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Testa mobil och dator i Chromium
        run: node scripts/browser_check.cjs
      - name: Spara skärmbilder för granskning
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvittokompis-ux-mobile-desktop
          path: ux-v2-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
